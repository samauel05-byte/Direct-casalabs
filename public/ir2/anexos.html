<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/css/mobile-base.css"><title>Anexos DGII</title><style>:root{--bg:#f6f2ea;--surface:#fffdf9;--border:#e7ded0;--text:#1e1810;--muted:#6a5c4b;--accent:#0a5fd4;--green:#15924a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui;padding:18px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head a,button{background:var(--surface);border:1px solid var(--border);color:var(--accent);border-radius:7px;padding:7px 11px;text-decoration:none;cursor:pointer;font:inherit}.head strong{font-size:15px}.empresa,.hint{color:var(--muted)}.card{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}select,input{background:#fffdf9;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px}input{width:95%}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{padding:8px;border-bottom:1px solid #eadfce;text-align:left}th{color:var(--accent)}td.num,th.num{text-align:right}.tag{color:var(--green);font-size:12px}.hidden{display:none}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>/* Tipografia de marca Direct: Josefin Sans en titulos, Poppins en el resto */:root{--font-body:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-head:'Josefin Sans','Poppins',system-ui,sans-serif}body,input,select,textarea,button,.btn{font-family:var(--font-body)}h1,h2,h3,h4,h5,.title,.ttl,.brand,.auth-ttl{font-family:var(--font-head)}</style></head><body>
<div class="head"><a id="back" href="/ir2/resumen.html">← Datos DGII</a><strong>Anexos DGII</strong><span class="empresa" id="empresa"></span></div><div class="card"><label>Anexo del IR-2: <select id="anexo" onchange="render()"></select></label><p class="hint" id="description"></p><p class="tag hidden" id="source-note">✓ Información cargada desde Gastos NCF.</p><button onclick="add()">+ Agregar fila</button><table><thead id="table-head"></thead><tbody id="rows"></tbody><tfoot id="total"></tfoot></table></div>
<script>
const anexos=['D-2','D-1','D','A-1','A-2','A-3','B-1','B-2','B-3','B-4','E','H-1','H-2','G','J','IR-2','Activo'];
const q=new URLSearchParams(location.search),rnc=q.get('rnc')||'',anio=q.get('anio')||new Date().getFullYear(),key='save-anexos-'+(rnc||'nuevo')+'-'+anio;let data=JSON.parse(localStorage.getItem(key)||'{}');const el=id=>document.getElementById(id),n=v=>parseFloat(v)||0,money=v=>n(v).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
el('empresa').textContent=[q.get('nombre'),rnc,anio].filter(Boolean).join(' · ');el('back').href='/ir2/resumen.html?'+new URLSearchParams({rnc,nombre:q.get('nombre')||'',anio});el('anexo').innerHTML=anexos.map(x=>`<option value="${x}">${x}</option>`).join('');el('anexo').value=anexos.includes(q.get('anexo'))?q.get('anexo'):'D-2';
function save(){localStorage.setItem(key,JSON.stringify(data))}function isJ(){return el('anexo').value==='J'}function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function add(){const a=el('anexo').value;(data[a]||(data[a]=[])).push(isJ()?{tipo_gasto:'',monto:0,cantidad_ncf:0}:{c:'',r:'',m:'',o:''});save();render()}function update(i,f,v){data[el('anexo').value][i][f]=['monto','cantidad_ncf','m'].includes(f)?n(v):v;save();render()}function del(i){data[el('anexo').value].splice(i,1);save();render()}
function render(){const a=el('anexo').value,rows=data[a]||[],j=isJ();el('description').textContent=j?'Anexo J — detalle anual de gastos con NCF, agrupado por tipo de gasto.':'Plantilla para registrar la información del anexo seleccionado.';el('source-note').classList.toggle('hidden',!(j&&q.get('origen')==='gastos'));el('table-head').innerHTML=j?'<tr><th>Tipo de gasto</th><th class="num">Monto</th><th class="num">Cantidad NCF</th><th></th></tr>':'<tr><th>Concepto</th><th>Referencia / Identificador</th><th class="num">Monto</th><th>Observación</th><th></th></tr>';el('rows').innerHTML=rows.length?rows.map((x,i)=>j?`<tr><td><input value="${esc(x.tipo_gasto)}" oninput="update(${i},'tipo_gasto',this.value)"></td><td class="num"><input type="number" min="0" step="0.01" value="${x.monto||''}" oninput="update(${i},'monto',this.value)"></td><td class="num"><input type="number" min="0" step="1" value="${x.cantidad_ncf||''}" oninput="update(${i},'cantidad_ncf',this.value)"></td><td><button onclick="del(${i})">×</button></td></tr>`:`<tr><td><input value="${esc(x.c)}" oninput="update(${i},'c',this.value)"></td><td><input value="${esc(x.r)}" oninput="update(${i},'r',this.value)"></td><td class="num"><input type="number" value="${x.m||''}" oninput="update(${i},'m',this.value)"></td><td><input value="${esc(x.o)}" oninput="update(${i},'o',this.value)"></td><td><button onclick="del(${i})">×</button></td></tr>`).join(''):`<tr><td colspan="${j?4:5}" class="hint">Sin información registrada.</td></tr>`;el('total').innerHTML=j?`<tr><th>TOTALES</th><th class="num">${money(rows.reduce((s,x)=>s+n(x.monto),0))}</th><th class="num">${rows.reduce((s,x)=>s+n(x.cantidad_ncf),0).toLocaleString('es-DO')}</th><th></th></tr>`:''}
async function importGastos(){if(q.get('origen')!=='gastos'||!rnc)return;try{const token=sessionStorage.getItem('dtoken')||'',response=await fetch(`/api/ir2/resumen?rnc=${encodeURIComponent(rnc)}&anio=${encodeURIComponent(anio)}&tipo=dgii-modulos`,{headers:{Authorization:'Bearer '+token}}),record=await response.json(),gastos=record?.record?.data?.gastos;if(Array.isArray(gastos)){data.J=gastos.map(x=>({tipo_gasto:x.tipo_gasto||'Sin clasificar',monto:x.monto??x.mtotal??0,cantidad_ncf:x.cantidad_ncf??(x.ncf?1:0)}));save()}}catch(e){console.warn('No se pudieron cargar los gastos',e)}}
Object.assign(window,{add,update,del,render});
importGastos().then(render);render();
</script></body></html>
