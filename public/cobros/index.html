<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/css/mobile-base.css">
<link rel="icon" type="image/svg+xml" href="/img/favicon-cobros.svg?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-cobros-32.png?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-cobros-48.png?v=1">
<link rel="shortcut icon" href="/img/favicon-cobros-32.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="/serp-host.js"></script>
<title>Cobros</title>
<style>
:root{--bg:#f3f7f4;--surf:#fff;--surf2:#eaf2ed;--bdr:rgba(20,60,40,.14);--fg:#14241b;--fg2:#5a6e62;--acc:#0f8a5f;--ok:#15924a;--bad:#dc2626;--r:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1a;--surf:#0f1e38;--surf2:#162440;--bdr:rgba(30,90,200,.28);--fg:#e8f0ff;--fg2:#7a9bc0;--acc:#10b981;--ok:#20BD5A;--bad:#ef4444}}
:root[data-theme="dark"]{--bg:#070d1a;--surf:#0f1e38;--surf2:#162440;--bdr:rgba(30,90,200,.28);--fg:#e8f0ff;--fg2:#7a9bc0;--acc:#10b981;--ok:#20BD5A;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Poppins',system-ui,sans-serif;font-size:14px}
h1,h2{font-family:'Josefin Sans','Poppins',sans-serif}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bdr);background:var(--surf);position:sticky;top:0;z-index:5}
.hdr h1{margin:0;font-size:18px;flex:1}
.back,.btn{border:1px solid var(--bdr);background:var(--surf2);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.btn.sm{padding:5px 9px;font-size:12px}.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px 0;max-width:1100px;margin:0 auto}
.tab{border:1px solid var(--bdr);background:var(--surf);color:var(--fg2);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:9px 10px;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);font-weight:500}.chk input{width:auto}
.msg{border-radius:10px;padding:9px 12px;margin-bottom:12px;font-weight:500}
.msg.ok{background:rgba(21,146,74,.12);color:var(--ok)}.msg.err{background:rgba(220,38,38,.12);color:var(--bad)}.msg.warn{background:rgba(245,158,11,.14);color:#92400e}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surf2);border-radius:12px;padding:12px}.kpi b{display:block;font-size:18px;margin-top:2px}.kpi span{font-size:12px;color:var(--fg2)}
.tw{overflow:auto;border:1px solid var(--bdr);border-radius:12px}
table{border-collapse:collapse;width:100%}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);text-align:left;padding:8px 10px;background:var(--surf2)}
td{padding:8px 10px;border-top:1px solid var(--bdr);vertical-align:top}
.bad{color:var(--bad)}.okc{color:var(--ok)}.mut{color:var(--fg2);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.right{text-align:right}
@media(max-width:700px){.sp-wrap{grid-template-columns:1fr!important}}
@media(max-width:640px){.wrap{padding:10px}}
</style>
</head>
<body>
<div class="hdr"><button class="back" onclick="serpBack()">← Volver</button><h1>Cobros</h1></div>
<div class="tabs" id="tabs"></div>
<div class="wrap"><div id="msg"></div><div id="view"><p class="mut">Cargando…</p></div></div>
<script>
let TOKEN='', SESSION_ID='', TAB='resumen';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['resumen','Resumen'],['clientes','Clientes'],['cotizaciones','Cotizaciones'],['cobros','Cobros'],['promos','Promociones'],['historial','Historial']];
const sid=()=>SESSION_ID||localStorage.getItem('direct_session_id')||'';
async function api(route,opts={}){
  const h={Authorization:'Bearer '+TOKEN}; if(sid()) h['X-Direct-Session']=sid(); if(opts.body) h['Content-Type']='application/json';
  let r; try{ r=await fetch('/api/cobros?route='+route,{headers:h,method:opts.method||'GET',body:opts.body?JSON.stringify(opts.body):undefined}); }
  catch(e){ throw new Error('Sin conexión con el servidor.'); }
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||('Error '+r.status)); return d;
}
const money=(a,c)=>new Intl.NumberFormat('es-DO',{style:'currency',currency:c==='USD'?'USD':'DOP'}).format(Number(a)||0);
const TZ='America/Santo_Domingo';
const dt=iso=>iso?new Intl.DateTimeFormat('es-DO',{dateStyle:'short',timeStyle:'short',timeZone:TZ}).format(new Date(iso)):'—';
const dd=iso=>iso?new Intl.DateTimeFormat('es-DO',{dateStyle:'medium',timeZone:'UTC'}).format(new Date(String(iso).slice(0,10)+'T12:00:00Z')):'—';
function flash(text,kind){ $('msg').innerHTML=text?`<div class="msg ${kind||'ok'}">${esc(text)}</div>`:''; }
function renderTabs(){ $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab${k===TAB?' on':''}" data-tab="${k}">${l}</button>`).join(''); }
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b){ TAB=b.dataset.tab; flash(''); load(); } });
const providerWarn=p=>{ const w=[]; if(p&&!p.email) w.push('correo de Cobros'); if(p&&!p.whatsapp) w.push('WhatsApp (Twilio)'); return w.length?`<div class="msg warn">Falta configurar ${w.join(' y ')} en el servidor: los envíos por ese canal fallarán y quedarán registrados en el historial.</div>`:''; };
const f=(label,inner)=>`<label class="f">${label}${inner}</label>`;

async function load(){
  renderTabs(); $('view').innerHTML='<p class="mut">Cargando…</p>';
  try{ await ({resumen:vResumen,clientes:vClientes,cotizaciones:vCotizaciones,cobros:vCobros,promos:vPromos,historial:vHistorial})[TAB](); }
  catch(e){ $('view').innerHTML=''; flash(e.message,'err'); }
}
const TIPO={reminder:'Recordatorio',promo:'Promoción',invoice:'Cobro',receipt:'Comprobante',quote:'Cotización',factura:'Factura'}, CH={email:'Correo',whatsapp:'WhatsApp'};
const logRows=(rows,full)=>rows.map(m=>`<tr><td>${dt(m.created_at)}</td>${full?`<td>${esc(m.client_name)}</td>`:''}<td>${CH[m.channel]}</td><td>${TIPO[m.kind]||''}</td><td>${esc(m.recipient)}</td><td class="${m.status==='failed'?'bad':'okc'}">${m.status==='failed'?'Fallido':'Enviado'}${m.error?`<div class="mut">${esc(m.error)}</div>`:''}</td>${full?`<td class="mut" title="${esc(m.body)}">${esc((m.body||'').slice(0,80))}</td>`:''}</tr>`).join('');

async function vResumen(){
  const d=await api('dashboard'); const t=d.totals;
  const box=(c,name)=>`<div class="card"><h2 style="margin:0 0 10px;font-size:15px">${name}</h2><div class="kpis"><div class="kpi"><span>Por cobrar</span><b>${money(t[c].receivable,c)}</b></div><div class="kpi"><span>Vencido</span><b class="bad">${money(t[c].overdue,c)}</b></div><div class="kpi"><span>Cobrado este mes</span><b class="okc">${money(t[c].paid,c)}</b></div></div></div>`;
  $('view').innerHTML=providerWarn(d.providers)+box('DOP','Pesos dominicanos (RD$)')+box('USD','Dólares (US$)')+
   `<p class="mut">Clientes registrados: <b>${d.clients}</b></p><div class="card"><h2 style="margin:0 0 10px;font-size:15px">Últimos mensajes</h2><div class="tw"><table><thead><tr><th>Fecha</th><th>Canal</th><th>Tipo</th><th>Destino</th><th>Estado</th></tr></thead><tbody>${logRows(d.recent,false)||'<tr><td colspan="5" class="mut">Aún no hay mensajes.</td></tr>'}</tbody></table></div></div>`;
}

async function vClientes(){
  const {clients}=await api('clients');
  $('view').innerHTML=`<form class="card" id="f-cli"><div class="grid">
    ${f('Nombre *','<input name="name" required>')}${f('Correo','<input name="email" type="email">')}${f('WhatsApp (+1809…)','<input name="phone" placeholder="+18095551234">')}
    ${f('Empresa','<input name="company">')}${f('Etiquetas (separadas por coma)','<input name="tags" placeholder="web, mantenimiento">')}${f('Notas','<input name="notes">')}
    </div><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;align-items:center">
    <label class="chk"><input type="checkbox" name="opt_in_email" checked> Acepta correos</label><label class="chk"><input type="checkbox" name="opt_in_whatsapp"> Acepta WhatsApp</label>
    <button class="btn pri" style="margin-left:auto">Agregar cliente</button></div></form>
    <div class="tw"><table><thead><tr><th>Nombre</th><th>Contacto</th><th>Etiquetas</th><th>Consentimiento</th><th></th></tr></thead><tbody>${clients.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="mut">${esc(c.company)}</div></td><td>${esc(c.email)}<div class="mut">${esc(c.phone)}</div></td><td>${esc((c.tags||[]).join(', '))}</td>
    <td><div class="acts" style="justify-content:flex-start">${c.opt_in_email?`<button class="btn sm" data-optout="${c.id}" data-ch="email" title="Dar de baja del correo">Correo ✓ · baja</button>`:''}${c.opt_in_whatsapp?`<button class="btn sm" data-optout="${c.id}" data-ch="whatsapp" title="Dar de baja de WhatsApp">WhatsApp ✓ · baja</button>`:''}${!c.opt_in_email&&!c.opt_in_whatsapp?'<span class="mut">Sin consentimiento</span>':''}</div></td>
    <td class="right"><button class="btn sm bad" data-delcli="${c.id}" data-name="${esc(c.name)}">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Aún no hay clientes.</td></tr>'}</tbody></table></div>`;
  $('f-cli').onsubmit=async e=>{ e.preventDefault(); const fd=new FormData(e.target);
    try{ await api('clients',{method:'POST',body:{name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone'),company:fd.get('company'),tags:fd.get('tags'),notes:fd.get('notes'),opt_in_email:fd.get('opt_in_email')==='on',opt_in_whatsapp:fd.get('opt_in_whatsapp')==='on'}}); await load(); flash('Cliente guardado.'); }
    catch(er){ flash(er.message,'err'); } };
}

// ── Calendario de avisos ───────────────────────────────────────────────────────────────────────────────
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'], MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const todayISO=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const addDays=(iso,n)=>{ const t=new Date(iso+'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
const dayLabel=iso=>{ const [y,m,d]=iso.split('-'); return `${Number(d)} ${MES3[Number(m)-1]}`; };
const HORAS=['8:00 a. m.','1:00 p. m.','6:00 p. m.'];
// «5, 6, 7, 8 dic» y «12 dic» a partir de días sueltos: agrupa los consecutivos en rangos.
function compactDates(list){ const ds=[...list].sort(), out=[]; let a=null,b=null;
  const push=()=>{ if(!a) return; out.push(a===b?dayLabel(a):(a.slice(0,7)===b.slice(0,7)?`${Number(a.slice(8))}–${dayLabel(b)}`:`${dayLabel(a)} – ${dayLabel(b)}`)); };
  for(const x of ds){ if(a&&addDays(b,1)===x){ b=x; } else { push(); a=b=x; } } push(); return out.join(', '); }
function avisoTexto(i){
  if(i.remind_dates&&i.remind_dates.length){ const per=i.remind_per_day||1; return `Avisa: ${compactDates(i.remind_dates.map(x=>String(x).slice(0,10)))} · ${per} ${per===1?'correo':'correos'} al día`; }
  return `Avisa: ${(i.remind_days&&i.remind_days.length?i.remind_days:[3,1]).join(', ')} día(s) antes`;
}
// Calendario donde se marcan los días de aviso. opt: {due:()=>'AAAA-MM-DD'|'', dates:[], perDay:1, overdue:true}
function schedulePicker(root,opt){
  const today=todayISO(); const st={dates:new Set((opt.dates||[]).map(x=>String(x).slice(0,10))), per:opt.perDay||1, overdue:opt.overdue!==false, ym:null};
  const start=opt.due&&opt.due()||today; st.ym=(st.dates.size?[...st.dates].sort()[0]:start).slice(0,7);
  const due=()=>(opt.due&&opt.due())||'';
  const selected=()=>[...st.dates].sort();
  function grid(){ const [y,m]=st.ym.split('-').map(Number); const first=new Date(Date.UTC(y,m-1,1)), wd=(first.getUTCDay()+6)%7, n=new Date(Date.UTC(y,m,0)).getUTCDate(); const dueD=due(); let h='';
    ['L','M','M','J','V','S','D'].forEach(x=>{ h+=`<div class="mut" style="text-align:center;font-size:11px;font-weight:600">${x}</div>`; });
    for(let k=0;k<wd;k++) h+='<div></div>';
    for(let d=1;d<=n;d++){ const iso=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, past=iso<today, on=st.dates.has(iso), isDue=iso===dueD;
      h+=`<button type="button" ${past?'disabled':''} data-day="${iso}" title="${isDue?'Día de vencimiento':''}" style="padding:8px 0;border-radius:9px;border:${isDue?'2px solid #c99a1f':'1px solid var(--bdr)'};background:${on?'var(--acc)':'var(--surf)'};color:${on?'#fff':'var(--fg)'};font:inherit;font-weight:${on||isDue?700:500};cursor:${past?'default':'pointer'};opacity:${past?.35:1}">${d}</button>`; }
    return h; }
  function summary(){ const ds=selected(), tot=ds.length*st.per;
    if(!ds.length) return `<span class="mut">No hay días elegidos: se avisará <b>3 y 1 día antes</b> del vencimiento. Marca días en el calendario para elegir los tuyos.</span>`;
    return `<b>${ds.length} ${ds.length===1?'día':'días'}</b> elegidos (${esc(compactDates(ds))}) × <b>${st.per} ${st.per===1?'correo':'correos'} al día</b> = <b>${tot} ${tot===1?'correo':'correos'}</b> en total.`; }
  function render(){ const [y,m]=st.ym.split('-').map(Number), dueD=due();
    root.innerHTML=`<div style="border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;background:var(--surf2)">
      <div style="font-weight:600;margin-bottom:2px">🔔 ¿Qué días enviar los correos al cliente?</div>
      <div class="mut" style="margin-bottom:10px">Toca los días del calendario para marcarlos. ${dueD?`El día de vencimiento (<b>${esc(dayLabel(dueD))}</b>) tiene el borde dorado.`:'Elige primero la fecha de vencimiento para verla marcada.'}</div>
      <div style="display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:16px;align-items:start" class="sp-wrap">
        <div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><button type="button" class="btn sm" data-nav="-1">‹</button><b style="text-transform:capitalize">${MESES[m-1]} ${y}</b><button type="button" class="btn sm" data-nav="1">›</button></div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${grid()}</div></div>
        <div>
          <div style="font-weight:600;margin-bottom:6px;font-size:13px">Atajos</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
            <button type="button" class="btn sm" data-act="all" ${dueD&&dueD>=today?'':'disabled'}>Todos los días hasta el vencimiento</button>
            <button type="button" class="btn sm" data-act="week" ${dueD&&dueD>=today?'':'disabled'}>Última semana</button>
            <button type="button" class="btn sm" data-act="due" ${dueD&&dueD>=today?'':'disabled'}>Día del vencimiento</button>
            <button type="button" class="btn sm bad" data-act="clear">Limpiar</button></div>
          <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:12px"><label class="f" style="flex:1;min-width:120px">Desde<input type="date" data-r="a" min="${today}"></label><label class="f" style="flex:1;min-width:120px">Hasta<input type="date" data-r="b" min="${today}"></label><button type="button" class="btn sm" data-act="range" style="height:38px">Marcar rango</button></div>
          <label class="f" style="margin-bottom:8px">¿Cuántos correos por día?<select data-per>${[1,2,3].map(n=>`<option value="${n}"${n===st.per?' selected':''}>${n} ${n===1?'correo':'correos'} al día${n>1?' ('+HORAS.slice(0,n).join(' · ')+')':' ('+HORAS[0]+')'}</option>`).join('')}</select></label>
          <label class="chk"><input type="checkbox" data-over ${st.overdue?'checked':''}> Si vence sin pagarse, seguir avisando cada 3 días</label></div></div>
      <div style="margin-top:12px;line-height:1.5" data-sum>${summary()}</div>
      <div class="mut" style="margin-top:8px;line-height:1.5;font-size:12.5px"><b>Cada correo sube de tono:</b> 1.º «Se acerca tu fecha de pago» · 2.º «Recordatorio: tu pago vence pronto» · 3.º en adelante «Aviso importante: pago pendiente». El día del vencimiento dice «Hoy vence tu pago» y, si se atrasa, «Pago vencido».</div></div>`; }
  root.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!root.contains(b)) return;
    if(b.dataset.day){ if(st.dates.has(b.dataset.day)) st.dates.delete(b.dataset.day); else st.dates.add(b.dataset.day); render(); }
    else if(b.dataset.nav){ const [y,m]=st.ym.split('-').map(Number), t=new Date(Date.UTC(y,m-1+Number(b.dataset.nav),1)); st.ym=t.toISOString().slice(0,7); render(); }
    else if(b.dataset.act==='clear'){ st.dates.clear(); render(); }
    else if(b.dataset.act==='due'){ const dd0=due(); if(dd0>=today) st.dates.add(dd0); render(); }
    else if(b.dataset.act==='all'||b.dataset.act==='week'){ const dd0=due(); if(!dd0||dd0<today) return; let a=b.dataset.act==='week'?addDays(dd0,-6):today; if(a<today) a=today; for(let x=a;x<=dd0&&st.dates.size<60;x=addDays(x,1)) st.dates.add(x); render(); }
    else if(b.dataset.act==='range'){ const a=root.querySelector('[data-r=a]').value, z=root.querySelector('[data-r=b]').value; if(!a||!z||z<a) return flash('Elige «Desde» y «Hasta» (el segundo no puede ser anterior).','err'); for(let x=a<today?today:a;x<=z&&st.dates.size<60;x=addDays(x,1)) st.dates.add(x); st.ym=(a<today?today:a).slice(0,7); render(); }
  });
  root.addEventListener('change',e=>{ if(e.target.matches('[data-per]')){ st.per=Number(e.target.value); root.querySelector('[data-sum]').innerHTML=summary(); } else if(e.target.matches('[data-over]')) st.overdue=e.target.checked; });
  render();
  return { get:()=>({dates:selected(),per_day:st.per,overdue:st.overdue}), refresh:render };
}
// Cambiar los avisos de un cobro que ya existe (ventana con el mismo calendario)
function openSchedModal(id){ const inv=(window.__invs||{})[id]; if(!inv) return;
  const m=document.createElement('div'); m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto';
  m.innerHTML=`<div style="background:var(--surf);border-radius:16px;padding:18px;width:100%;max-width:760px"><h2 style="margin:0 0 4px;font-size:16px">Calendario de avisos</h2><div class="mut" style="margin-bottom:10px">${esc(inv.client_name)} · ${esc(inv.concept)} · vence ${dd(inv.due_date)}</div><div id="sm-root"></div><div class="acts" style="margin-top:14px"><button class="btn" id="sm-x">Cancelar</button><button class="btn pri" id="sm-ok">Guardar avisos</button></div></div>`;
  document.body.appendChild(m);
  const pk=schedulePicker(m.querySelector('#sm-root'),{due:()=>String(inv.due_date).slice(0,10),dates:inv.remind_dates||[],perDay:inv.remind_per_day||1,overdue:inv.remind_overdue!==false});
  m.querySelector('#sm-x').onclick=()=>m.remove(); m.addEventListener('click',e=>{ if(e.target===m) m.remove(); });
  m.querySelector('#sm-ok').onclick=async()=>{ try{ const g=pk.get(); const r=await api('invoices/'+id+'/notice-days',{method:'POST',body:{dates:g.dates,per_day:g.per_day,overdue:g.overdue,days:''}}); m.remove(); await load(); flash(r.message); }catch(er){ flash(er.message,'err'); m.remove(); } };
}

async function vCobros(){
  const d=await api('invoices'); const fx=await api('fx').catch(()=>null); const ST={pending:'Pendiente',paid:'Pagado',overdue:'Vencido',cancelled:'Cancelado'};

// Lista de correos: acepta una columna pegada de Excel (correo [tab] nombre), una línea con comas, o un archivo.
const EMAIL_RX=/[^\s@,;<>()"'\t]+@[^\s@,;<>()"'\t]+\.[^\s@,;<>()"'\t]{2,}/g;
function parseList(text){
  const seen=new Set(), rows=[]; let bad=0, dups=0;
  for(const line of String(text||'').split(/\r?\n/)){
    const found=line.match(EMAIL_RX)||[]; if(!found.length){ if(/@/.test(line)) bad++; continue; }
    const rest=found.reduce((l,e)=>l.replace(e,' '),line).replace(/mailto:/gi,'').split(/[\t;,]+/).map(x=>x.trim()).filter(Boolean);
    const name=found.length===1?rest.join(' ').slice(0,120):'';
    for(const e of found){ const k=e.toLowerCase(); if(seen.has(k)){ dups++; continue; } seen.add(k); rows.push({email:k,name}); }
  }
  return {rows,bad,dups};
}
async function fileToText(file){
  if(/\.(xlsx|xls)$/i.test(file.name)){
    if(typeof XLSX==='undefined') await new Promise((ok,no)=>{ const el=document.createElement('script'); el.src='/cami/vendor/xlsx.full.min.js'; el.onload=ok; el.onerror=()=>no(new Error('No se pudo cargar el lector de Excel.')); document.head.appendChild(el); });
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.join('\t')).join('\n');
  }
  return await file.text();
}

async function download(route){ const r=await api(route); const bin=atob(r.base64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:'application/pdf'})), a=document.createElement('a'); a.href=url; a.download=r.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
