<!--
  Botones de suscripción de PayPal para Direct: US$20 por usuario/mes o US$220 por usuario/año, sin tope.
  Ambos siguen cobrando hasta que el cliente cancele.
  1) Reemplaza TU_CLIENT_ID por el «Client ID» de tu app de PayPal (el mismo entorno donde creaste los planes).
  2) Los planes activos son P-40C63856H2223050UNLRQ22A (mensual) y
     P-3Y610531YH220333YNLRQ22I (anual, con un mes gratis).
  3) Pega este bloque donde quieras mostrar los botones.
  Cuando el cliente paga, PayPal avisa a Direct (webhook), Direct crea su licencia y le manda por correo el enlace
  para crear su usuario y su contraseña. En cada cobro, la licencia se renueva hasta el siguiente cobro.
-->
<style>
  .direct-planes{display:flex;flex-wrap:wrap;gap:24px;font-family:system-ui,sans-serif}
  .direct-plan{flex:1 1 280px;max-width:360px;border:1px solid #ddd;border-radius:14px;padding:22px}
  .direct-plan h3{margin:0 0 4px}
  .direct-plan .precio{font-size:28px;font-weight:700;margin:6px 0 14px}
  .direct-plan .precio small{font-size:14px;font-weight:400;color:#666}
</style>
<div class="direct-planes" id="direct-planes">
  <label>Usuarios: <input id="direct-usuarios" type="number" min="1" step="1" value="1"></label>
  <div class="direct-plan">
    <h3>Plan mensual</h3>
    <div class="precio">US$20 <small>por usuario / mes</small></div>
    <div id="paypal-direct-mensual"></div>
  </div>
  <div class="direct-plan">
    <h3>Plan anual · un mes gratis</h3>
    <div class="precio">US$220 <small>por usuario / año</small></div>
    <div id="paypal-direct-anual"></div>
  </div>
</div>
<p id="paypal-direct-gracias" style="display:none;font-family:system-ui,sans-serif">
  ¡Gracias! Te enviamos un correo con el enlace para crear tu usuario y tu contraseña de Direct.
  Si no lo ves en unos minutos, revisa spam o escríbenos.
</p>
<script src="https://www.paypal.com/sdk/js?client-id=TU_CLIENT_ID&vault=true&intent=subscription&currency=USD"></script>
<script>
  function cantidad() {
    const n = Number(document.getElementById('direct-usuarios').value);
    if (!Number.isInteger(n) || n < 1) throw new Error('Elige al menos 1 usuario.');
    return n;
  }
  function direct_boton(selector, planId) {
    paypal.Buttons({
      style: { shape: 'rect', color: 'blue', layout: 'vertical', label: 'subscribe' },
      createSubscription: function (data, actions) { return actions.subscription.create({ plan_id: planId, quantity: String(cantidad()) }); },
      onApprove: function () {
        document.getElementById('direct-planes').style.display = 'none';
        document.getElementById('paypal-direct-gracias').style.display = 'block';
      }
    }).render(selector);
  }
  direct_boton('#paypal-direct-mensual', 'P-40C63856H2223050UNLRQ22A');
  direct_boton('#paypal-direct-anual', 'P-3Y610531YH220333YNLRQ22I');
</script>
