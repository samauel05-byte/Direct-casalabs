<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nómina</title>
<style>
  :root{
    --bg:#0a1120; --panel:#101b30; --panel2:#0c1526; --elev:#16233c;
    --line:#223049; --line2:#2d3f5d;
    --ink:#eaf0fb; --muted:#93a4c4; --faint:#5f7399;
    --accent:#f59e0b; --accent2:#fbbf24; --accentink:#1a1203; --accent-soft:rgba(245,158,11,.13);
    --blue:#60a5fa; --ok:#22c55e; --crit:#f87171;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.30);
  }
  /* Tema claro: fondo blanco y letras oscuras. El shell pone data-theme en el
     iframe; redefinir las variables basta para voltear todo el módulo. */
  :root[data-theme="light"]{
    --bg:#eef2f8; --panel:#ffffff; --panel2:#f6f8fc; --elev:#ffffff;
    --line:#dde4ef; --line2:#c6d1e2;
    --ink:#10203a; --muted:#54657f; --faint:#8090a8;
    --accent-soft:rgba(245,158,11,.14); --shadow:0 8px 24px rgba(20,40,80,.10);
  }
  :root[data-theme="light"] body{ background:radial-gradient(1200px 500px at 70% -10%,#e7eefc 0%,transparent 60%),var(--bg); }
  :root[data-theme="light"] ::-webkit-scrollbar-thumb{ background:#c7d2e3; border-color:var(--bg); }
  *{ box-sizing:border-box; }
  body{ margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
    background:radial-gradient(1200px 500px at 70% -10%, #13213c 0%, transparent 60%), var(--bg); min-height:100vh; }
  h1,h2,h3{ margin:0 0 .4em; } h1{ font-size:20px; } h2{ font-size:16px; letter-spacing:.2px; } h3{ font-size:13px; }
  .muted{ color:var(--muted); } .mono{ font-family:ui-monospace,Menlo,Consolas,monospace; }
  a{ color:var(--accent); }
  ::-webkit-scrollbar{ height:10px; width:10px; } ::-webkit-scrollbar-thumb{ background:#223049; border-radius:8px; border:2px solid var(--bg); }
  header.top{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--line);
    background:rgba(12,21,38,.85); backdrop-filter:blur(8px); position:sticky; top:0; z-index:5; }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.3px; font-size:16px; }
  .brand .mk{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px;
    background:linear-gradient(135deg,var(--accent),#b45309); color:var(--accentink); box-shadow:0 2px 10px rgba(245,158,11,.4); }
  .brand b{ color:var(--accent); font-weight:800; }
  .spacer{ flex:1; }
  select,input,button,textarea{ font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:8px 11px; transition:border-color .12s, box-shadow .12s, background .12s; }
  select:focus,input:focus,textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  input::placeholder,textarea::placeholder{ color:var(--faint); }
  select{ cursor:pointer; }
  button.btn,.btn{ cursor:pointer; background:var(--elev); border:1px solid var(--line2); border-radius:10px; font-weight:600; }
  .btn:hover{ border-color:#3a527a; background:#1a2a46; }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:linear-gradient(135deg,var(--accent),#d97706); color:var(--accentink); border-color:transparent; box-shadow:0 2px 12px rgba(245,158,11,.28); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.sm{ padding:5px 9px; font-size:12px; border-radius:8px; }
  .btn.danger{ color:#fecaca; background:#3b1d1d; border-color:#5b2626; }
  .btn.danger:hover{ background:#4c2222; }
  .btn.ghost{ background:transparent; border-color:transparent; }
  main{ padding:18px 26px; max-width:none; margin:0; }
  .tabs{ display:inline-flex; gap:4px; margin:6px 0 18px; padding:4px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; flex-wrap:wrap; }
  .tabs button{ border:none; background:transparent; border-radius:9px; padding:7px 15px; color:var(--muted); font-weight:600; }
  .tabs button:hover{ color:var(--ink); background:#17243e; }
  .tabs button.active{ background:var(--accent); color:var(--accentink); font-weight:700; box-shadow:0 2px 10px rgba(245,158,11,.25); }
  .card{ background:linear-gradient(180deg,#121f36,#101a2e); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card.stack{ display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grid{ display:grid; gap:10px; }
  table{ width:100%; border-collapse:separate; border-spacing:0; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; background:var(--panel2); position:sticky; top:0; z-index:1; }
  tbody tr:hover > td, table tr:hover > td{ background:rgba(255,255,255,.015); }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .table-wrap{ overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel2); max-height:none; }
  tr.tot td{ font-weight:800; border-top:2px solid var(--line2); background:#0e1a2e; position:sticky; bottom:0; }
  tr.clickable{ cursor:pointer; } tr.clickable:hover > td{ background:rgba(245,158,11,.06); }
  .cell-in{ width:104px; padding:6px 8px; text-align:right; background:#0c1728; border-color:#1d2a42; }
  .cell-in:hover{ border-color:#324665; } .cell-in.txt{ text-align:left; width:150px; }
  .cell-in:disabled{ opacity:.55; }
  .pill{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--line2); color:var(--muted); }
  .pill.ok{ color:#86efac; border-color:#1d5a40; background:rgba(34,197,94,.1); }
  .pill.calc{ color:#93c5fd; border-color:#24456f; background:rgba(96,165,250,.1); }
  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid var(--line2); }
  .badge.ok{ color:#86efac; } .badge.warn{ color:var(--accent2); } .badge.crit{ color:var(--crit); } .badge.accent{ color:var(--accent); }
  .empty{ color:var(--muted); text-align:center; padding:34px 16px; }
  .modal-bg{ position:fixed; inset:0; background:rgba(4,8,18,.66); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; animation:fade .12s ease; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .modal{ background:linear-gradient(180deg,#13203a,#0f1a2e); border:1px solid var(--line2); border-radius:16px; padding:20px; width:100%; max-width:540px; max-height:90vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .modal h2{ margin-bottom:2px; }
  label.f{ display:flex; flex-direction:column; gap:5px; font-size:13px; } label.f span{ color:var(--muted); }
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#0e1a2e; border:1px solid var(--line2); padding:11px 16px; border-radius:11px; z-index:40; box-shadow:0 12px 34px rgba(0,0,0,.45); font-weight:600; }
  .toast.err{ border-color:#5b2626; color:#fecaca; } .toast.ok{ border-color:#1d5a40; color:#bbf7d0; }
  .hint{ font-size:12px; color:var(--muted); }
  .total-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:2px 0 4px; }
  .total-kpis .k{ background:linear-gradient(180deg,#132ografia,#0e1a2e); background:linear-gradient(180deg,#13223c,#0e1a2e); border:1px solid var(--line); border-radius:13px; padding:13px 15px; position:relative; overflow:hidden; }
  .total-kpis .k::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line2); }
  .total-kpis .k .label{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); } .total-kpis .k .muted{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .total-kpis .k .v{ font-size:21px; font-weight:800; margin-top:3px; letter-spacing:.2px; }
  .total-kpis .k.neto .v{ color:var(--accent); } .total-kpis .k.neto::before{ background:var(--accent); }
  .total-kpis .k.aportes .v{ color:var(--blue); } .total-kpis .k.aportes::before{ background:var(--blue); }
  .total-kpis .k.aportes{ cursor:pointer; } .total-kpis .k.aportes:hover{ border-color:var(--blue); }
  .emp{ display:flex; align-items:center; gap:10px; }
  .av{ width:36px; height:36px; border-radius:11px; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .emp .en{ font-weight:700; } .emp .sub{ font-size:12px; color:var(--muted); margin-top:1px; } .emp .cid{ font-size:11px; color:var(--faint); }
  .nvsec{ margin-top:4px; } .nvsec h3{ font-size:11px; color:var(--accent); margin:2px 0 6px; text-transform:uppercase; letter-spacing:.4px; }
  .nv{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .nv .nl{ flex:1; } .nv .na{ width:130px; text-align:right; padding:6px 9px; } .nv .na.num{ font-variant-numeric:tabular-nums; }
  .nv.ro{ color:var(--muted); } .nv .nr{ width:130px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); }
  .sw input{ width:38px; height:21px; -webkit-appearance:none; appearance:none; background:#2a3a57; border-radius:999px; position:relative; cursor:pointer; outline:none; border:none; transition:background .15s; flex:0 0 auto; }
  .sw input:checked{ background:var(--accent); }
  .sw input::after{ content:''; position:absolute; top:2.5px; left:2.5px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .sw input:checked::after{ left:19px; }
  .nvtot{ display:flex; gap:20px; justify-content:flex-end; margin-top:14px; padding-top:12px; border-top:1px solid var(--line2); font-size:14px; } .nvtot .neto b{ color:var(--accent); font-size:17px; }
  .ajs{ border:1px solid var(--line); border-radius:13px; padding:14px 16px; margin-bottom:12px; background:var(--panel2); } .ajs h3{ font-size:12px; margin:0 0 10px; color:var(--accent); text-transform:uppercase; letter-spacing:.4px; }
  .ajs .grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  @media(max-width:620px){ main{ padding:12px; } .card{ padding:14px; } header.top{ padding:10px 12px; } }
</style>
</head>
<body>
<header class="top">
  <button class="btn sm" title="Volver a Accesos" onclick="try{parent.postMessage({action:'showPortals'},location.origin)}catch(e){}">‹ Volver</button>
  <span class="brand"><span class="mk">N</span><b>Nómina</b></span>
  <button class="btn sm" id="curco" title="Cambiar o crear empresa">— Empresa —</button>
  <span class="spacer"></span>
  <span class="muted mono" id="who"></span>
</header>
<main>
  <div class="tabs" id="tabs">
    <button data-tab="empresas">Empresas</button>
    <button data-tab="nomina" class="active">Nómina</button>
    <button data-tab="empleados">Empleados</button>
    <button data-tab="columnas">Columnas</button>
    <button data-tab="ajustes">Ajustes</button>
  </div>
  <div id="view"></div>
</main>
<script>
(function(){
  "use strict";
  const $ = (sel, el=document) => el.querySelector(sel);
  const esc = v => String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = v => (v==null||v===''||!isFinite(Number(v))) ? '0.00' : Number(v).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
  const numfmt = v => (v==null||v==='') ? '' : Number(v).toLocaleString('es-DO',{maximumFractionDigits:2});
  const initials = s => { const w=String(s||'').trim().split(/\s+/).filter(Boolean); return (((w[0]||'')[0]||'?')+((w[1]||'')[0]||'')).toUpperCase(); };
  // Aportes del empleador (espejo de lib/nomina/compute.js), con las tasas de Ajustes.
  function empAportes(base, exempt){ const st=S.period&&S.period.settings; if(!st||exempt) return 0; const b=Number(base)||0; const f=(st.period_type==='mensual')?1:0.5; const e=st.empleador||{}, em=st.empleado||{}; const ts=Number(em.tope_sfs)||b, ta=Number(em.tope_afp)||b; const afp=round2(Math.min(b,ta)*(e.afp||0)*f), sfs=round2(Math.min(b,ts)*(e.sfs||0)*f), srl=round2(Math.min(b,ts)*(e.srl||0)*f), inf=round2(b*(e.infotep||0)*f); return round2(afp+sfs+srl+inf); }

  // ── sesión (misma que SERP; el JWT nunca va en la URL) ──
  function authHeaders(){
    const h = {}; let token='', sid='';
    try { token = window.parent.sessionStorage.getItem('dtoken') || sessionStorage.getItem('dtoken') || ''; } catch(_){}
    try { sid = localStorage.getItem('direct_session_id') || ''; } catch(_){}
    if (token) h.Authorization = 'Bearer '+token;
    if (sid) h['X-Direct-Session'] = sid;
    return h;
  }
  async function api(method, path, body){
    const res = await fetch('/api/nomina/'+path, {
      method, headers: { ...authHeaders(), ...(body!==undefined?{'Content-Type':'application/json'}:{}) },
      body: body!==undefined ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(()=> ({}));
    if (!res.ok){ const e = new Error(data.error || ('Error '+res.status)); e.status = res.status; throw e; }
    return data;
  }
  let toastT;
  function toast(msg, kind=''){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.className='toast '+kind; t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), 3200); }
  function fail(e){ toast(e.message || 'Error', 'err'); }

  // ── evaluador de fórmulas (espejo de lib/nomina/formula.js, para el neto en vivo) ──
  const FUNCS = { round:(x,n=0)=>{const p=10**Math.trunc(n);return Math.round((Number(x)+Number.EPSILON)*p)/p;}, abs:Math.abs, floor:Math.floor, ceil:Math.ceil, min:(...a)=>Math.min(...a), max:(...a)=>Math.max(...a) };
  function tokenize(s){ const t=[]; let i=0; s=String(s);
    while(i<s.length){ const c=s[i];
      if(c<=' '){ i++; continue; }
      if('+-*/(),'.includes(c)){ t.push({t:c}); i++; continue; }
      if((c>='0'&&c<='9')||(c==='.'&&s[i+1]>='0'&&s[i+1]<='9')){ let j=i+1; while(j<s.length&&((s[j]>='0'&&s[j]<='9')||s[j]==='.'))j++; t.push({t:'num',v:Number(s.slice(i,j))}); i=j; continue; }
      if((c>='a'&&c<='z')||c==='_'){ let j=i+1; while(j<s.length&&((s[j]>='a'&&s[j]<='z')||(s[j]>='0'&&s[j]<='9')||s[j]==='_'))j++; t.push({t:'id',v:s.slice(i,j)}); i=j; continue; }
      throw new Error('fórmula'); }
    return t; }
  function parse(tk){ let p=0; const peek=()=>tk[p]; const eat=t=>{const x=tk[p]; if(!x||(t&&x.t!==t))throw new Error('fórmula'); p++; return x;};
    function expr(){ let n=term(); while(peek()&&(peek().t==='+'||peek().t==='-')){const o=eat().t; n={op:o,a:n,b:term()};} return n; }
    function term(){ let n=factor(); while(peek()&&(peek().t==='*'||peek().t==='/')){const o=eat().t; n={op:o,a:n,b:factor()};} return n; }
    function factor(){ const x=peek(); if(!x)throw new Error('fórmula');
      if(x.t==='-'){eat();return{neg:factor()};} if(x.t==='+'){eat();return factor();}
      if(x.t==='num'){eat();return{num:x.v};} if(x.t==='('){eat('(');const n=expr();eat(')');return n;}
      if(x.t==='id'){ eat('id'); if(peek()&&peek().t==='('){ if(!FUNCS[x.v])throw new Error('fn'); eat('('); const a=[]; if(peek()&&peek().t!==')'){a.push(expr()); while(peek()&&peek().t===','){eat(',');a.push(expr());}} eat(')'); return{call:x.v,args:a}; } return{ref:x.v}; }
      throw new Error('fórmula'); }
    const n=expr(); if(p!==tk.length)throw new Error('fórmula'); return n; }
  function ev(n,sc){ if(n.num!==undefined)return n.num; if(n.ref){const v=Number(sc[n.ref]);return isFinite(v)?v:0;} if(n.neg)return -ev(n.neg,sc); if(n.call)return FUNCS[n.call](...n.args.map(a=>ev(a,sc))); const a=ev(n.a,sc),b=ev(n.b,sc); return n.op==='+'?a+b:n.op==='-'?a-b:n.op==='*'?a*b:(b===0?0:a/b); }
  function evalFormula(src, scope){ try{ return round2(ev(parse(tokenize(src||'0')), scope||{})); }catch(_){ return 0; } }
  const round2 = x => { const n=Number(x); return isFinite(n) ? Math.round((n+Number.EPSILON)*100)/100 : 0; };

  function paramsFromSettings(st){ if(!st) return {}; const e=st.empleado||{}, i=st.isr||{}; const n=(v,d)=>isFinite(Number(v))?Number(v):d; return { p_div: st.period_type==='mensual'?1:2, p_afp:n(e.afp,0), p_sfs:n(e.sfs,0), p_tope_sfs:n(e.tope_sfs,1e12), p_tope_afp:n(e.tope_afp,1e12), p_isr_ex:n(i.exento,0), p_isr_t2:n(i.tramo2,0), p_isr_t3:n(i.tramo3,0) }; }
  function computeRow(columns, values, params){
    params = params || (S.period && paramsFromSettings(S.period.settings)) || {};
    const sc={...params}; for(const c of columns) if(c.type==='monto'||c.type==='numero') sc[c.key]=Number(values[c.key])||0;
    const cells={};
    for(const c of columns){
      if(c.type==='formula'){ const r=evalFormula(c.formula,sc); sc[c.key]=r; cells[c.key]=r; }
      else if(c.type==='monto') cells[c.key]=round2(sc[c.key]);
      else if(c.type==='numero') cells[c.key]=sc[c.key];
      else cells[c.key]=values[c.key]!=null?String(values[c.key]):'';
    }
    let ing=0, ded=0;
    for(const c of columns){ if((c.type==='monto'||c.type==='formula')&&c.include_total){ const n=Number(cells[c.key])||0; if(c.sign>0)ing+=n; else if(c.sign<0)ded+=n; } }
    ing=round2(ing); ded=round2(ded);
    return { cells, ingresos:ing, deducciones:ded, neto:round2(ing-ded) };
  }

  // ── estado ──
  const S = { clients:[], clientId:'', tab:'nomina', columns:[], employees:[], periods:[], period:null, lastPeriodId:null };
  const view = $('#view');
  const TYPE_LABEL = { monto:'Monto (RD$)', numero:'Número', texto:'Texto', formula:'Fórmula' };

  function syncTabs(){ [...$('#tabs').children].forEach(x=>x.classList.toggle('active', x.dataset.tab===S.tab)); }
  function updateCurco(){ const n=clientName(); $('#curco').textContent = n ? ('🏢 '+n) : '— Empresa —'; }

  async function boot(){
    try {
      const me = await api('GET','me'); $('#who').textContent = me.tenant?.name || '';
      const { clients } = await api('GET','clients'); S.clients = clients || [];
    } catch(e){ view.innerHTML = '<div class="card empty"><b>Su sesión terminó o se abrió en otro equipo.</b><br>Vuelva a iniciar sesión en SERP.</div>'; return; }
    let saved=''; try{ saved=localStorage.getItem('nomina_client_id')||''; }catch(_){}
    S.clientId = (saved && S.clients.some(c=>c.id===saved)) ? saved : (S.clients[0]?.id || '');
    if(!S.clientId) S.tab='empresas';
    $('#curco').onclick = ()=>{ S.tab='empresas'; S.period=null; syncTabs(); render(); };
    $('#tabs').onclick = e => { const b=e.target.closest('[data-tab]'); if(!b)return; S.tab=b.dataset.tab; S.period=null; syncTabs(); render(); };
    syncTabs(); await loadClient(); updateCurco(); render();
  }

  async function loadClient(){
    S.columns=[]; S.employees=[]; S.periods=[];
    if(!S.clientId) return;
    try {
      const [c,e,p] = await Promise.all([ api('GET',`clients/${S.clientId}/columns`), api('GET',`clients/${S.clientId}/employees`), api('GET',`clients/${S.clientId}/periods`) ]);
      S.columns=c.columns||[]; S.employees=e.employees||[]; S.periods=p.periods||[];
    } catch(err){ fail(err); }
  }

  async function selectClient(id){ S.clientId=id; try{ localStorage.setItem('nomina_client_id', id); }catch(_){} S.period=null; S.lastPeriodId=null; await loadClient(); updateCurco(); }

  function render(){
    if(S.tab==='empresas') return renderEmpresas();
    if(!S.clientId){ S.tab='empresas'; syncTabs(); return renderEmpresas(); }
    if(S.period) return renderPeriod();
    if(S.tab==='nomina') return renderNomina();
    if(S.tab==='empleados') return renderEmployees();
    if(S.tab==='columnas') return renderColumns();
    if(S.tab==='ajustes') return renderAjustes();
  }

  // ── EMPRESAS (propias de Nómina: el usuario crea la empresa y le sube la nómina) ──
  function renderEmpresas(){
    view.innerHTML = `<div class="card"><div class="row"><h2>Empresas</h2><span class="spacer"></span><button class="btn primary" id="addco">+ Nueva empresa</button></div>
      ${S.clients.length ? `<div class="table-wrap"><table><tr><th>Empresa</th><th>RNC</th><th>Estado</th><th></th></tr>
        ${S.clients.map(c=>`<tr class="clickable" data-open="${c.id}"><td><b>${esc(c.legal_name)}</b>${c.id===S.clientId?' <span class="pill ok">Seleccionada</span>':''}</td><td class="mono">${esc(c.rnc||'—')}</td><td>${c.active===false?'<span class="pill">Inactiva</span>':'<span class="pill ok">Activa</span>'}</td>
          <td class="num">${c.id===S.clientId?'':`<button class="btn sm primary" data-use="${c.id}">Usar</button> `}<button class="btn sm" data-edco="${c.id}">Editar</button> <button class="btn sm danger" data-delco="${c.id}">Borrar</button></td></tr>`).join('')}</table></div>`
        : '<div class="empty">Aún no tiene empresas.<br><br>Cree la primera para empezar a cargarle su nómina.</div>'}
      <p class="hint">Cada empresa tiene sus propias columnas, empleados, ajustes (tasas de ley) y períodos de nómina.</p></div>`;
    $('#addco').onclick=()=>companyModal(null);
    const use = async id => { await selectClient(id); S.tab='nomina'; syncTabs(); render(); toast('Empresa seleccionada','ok'); };
    view.querySelectorAll('[data-use]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); use(b.dataset.use); });
    view.querySelectorAll('[data-edco]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); companyModal(S.clients.find(x=>x.id===b.dataset.edco)); });
    view.querySelectorAll('[data-delco]').forEach(b=> b.onclick=async e=>{ e.stopPropagation(); const c=S.clients.find(x=>x.id===b.dataset.delco); if(!confirm(`¿Borrar la empresa "${c.legal_name}"? Se eliminarán sus columnas, empleados y períodos.`))return;
      try{ await api('DELETE',`clients/${c.id}`); const {clients}=await api('GET','clients'); S.clients=clients||[];
        if(S.clientId===c.id){ S.clientId=S.clients[0]?.id||''; try{ S.clientId?localStorage.setItem('nomina_client_id',S.clientId):localStorage.removeItem('nomina_client_id'); }catch(_){} await loadClient(); updateCurco(); }
        render(); toast('Empresa borrada','ok'); }catch(err){ fail(err);} });
    view.querySelectorAll('tr[data-open]').forEach(tr=> tr.onclick=()=> use(tr.dataset.open));
  }
  function companyModal(co){
    modal(`${co?'Editar':'Nueva'} empresa`, `
      <label class="f"><span>Nombre / Razón social *</span><input id="m-co-name" maxlength="160" value="${esc(co?.legal_name||'')}"></label>
      <label class="f"><span>RNC</span><input id="m-co-rnc" maxlength="20" value="${esc(co?.rnc||'')}"></label>
      ${co?`<label class="row" style="gap:8px"><input type="checkbox" id="m-co-active" ${co.active!==false?'checked':''} style="width:auto"> Activa</label>`:''}`,
      async()=>{ const legal_name=$('#m-co-name').value.trim(); if(!legal_name){ toast('Escriba el nombre','err'); return false; }
        const body={ legal_name, rnc:$('#m-co-rnc').value.trim() }; if(co) body.active=$('#m-co-active').checked;
        try{ const r=await api(co?'PATCH':'POST', co?`clients/${co.id}`:'clients', body); const {clients}=await api('GET','clients'); S.clients=clients||[];
          if(!co){ await selectClient(r.client.id); S.tab='nomina'; syncTabs(); } else updateCurco();
          render(); toast('Guardado','ok'); return true; }catch(e){ fail(e); return false; } });
  }

  // ── NÓMINA (pantalla principal): aterriza en el período más reciente ──
  async function renderNomina(){
    if(!S.periods.length){ view.innerHTML = '<div class="card empty">Aún no hay períodos de nómina.<br><br><button class="btn primary" id="np">+ Crear primer período</button></div>'; $('#np').onclick=newPeriod; return; }
    const pid = (S.lastPeriodId && S.periods.some(p=>p.id===S.lastPeriodId)) ? S.lastPeriodId : S.periods[0].id;
    await openPeriod(pid);
  }
  function newPeriod(){
    const def = `Nómina ${new Date().toLocaleDateString('es-DO',{month:'long',year:'numeric'})}`;
    modal('Nuevo período', `<label class="f"><span>Nombre del período *</span><input id="m-label" maxlength="80" value="${esc(def)}"></label>`,
      async()=>{ const label=$('#m-label').value.trim(); if(!label){toast('Escriba un nombre','err');return false;}
        try{ const now=new Date(); const { period } = await api('POST',`clients/${S.clientId}/periods`, { label, year:now.getFullYear(), month:now.getMonth()+1 }); await loadClient(); openPeriod(period.id); toast('Período creado','ok'); return true; }catch(e){ fail(e); return false; } });
  }

  // ── EMPLEADOS ──
  function renderEmployees(){
    view.innerHTML = `<div class="card"><div class="row"><h2>Empleados</h2><span class="spacer"></span><button class="btn primary" id="add">+ Empleado</button></div>
      ${S.employees.length ? `<div class="table-wrap"><table><tr><th>Nombre</th><th>Cédula</th><th>Puesto</th><th>Estado</th><th></th></tr>
        ${S.employees.map(e=>`<tr><td><b>${esc(e.full_name)}</b></td><td class="mono">${esc(e.identifier||'—')}</td><td>${esc(e.position||'—')}</td><td>${e.active?'<span class="pill ok">Activo</span>':'<span class="pill">Inactivo</span>'}</td>
          <td class="num"><button class="btn sm" data-ficha="${e.id}">Ficha</button> <button class="btn sm" data-ed="${e.id}">Editar</button> <button class="btn sm danger" data-del="${e.id}">Borrar</button></td></tr>`).join('')}</table></div>`
        : '<div class="empty">Aún no hay empleados. Agregue el primero.</div>'}</div>`;
    $('#add').onclick = () => employeeModal(null);
    view.querySelectorAll('[data-ficha]').forEach(b=> b.onclick=()=> openEmployee(b.dataset.ficha));
    view.querySelectorAll('[data-ed]').forEach(b=> b.onclick=()=> employeeModal(S.employees.find(x=>x.id===b.dataset.ed)));
    view.querySelectorAll('[data-del]').forEach(b=> b.onclick=async()=>{ if(!confirm('¿Borrar este empleado? Se quitará de los períodos.'))return; try{ await api('DELETE',`employees/${b.dataset.del}`); await loadClient(); render(); toast('Empleado borrado','ok'); }catch(e){ fail(e);} });
  }
  function employeeModal(emp){
    const m = modal(`${emp?'Editar':'Nuevo'} empleado`, `
      <label class="f"><span>Nombre completo *</span><input id="m-name" maxlength="120" value="${esc(emp?.full_name||'')}"></label>
      <label class="f"><span>Cédula</span><input id="m-id" maxlength="20" value="${esc(emp?.identifier||'')}"></label>
      <label class="f"><span>Puesto</span><input id="m-pos" maxlength="80" value="${esc(emp?.position||'')}"></label>
      <label class="row" style="gap:8px"><input type="checkbox" id="m-active" ${emp?.active!==false?'checked':''} style="width:auto"> Activo</label>`,
      async () => {
        const body = { full_name: $('#m-name').value.trim(), identifier: $('#m-id').value.trim(), position: $('#m-pos').value.trim(), active: $('#m-active').checked };
        if(!body.full_name){ toast('El nombre es obligatorio','err'); return false; }
        try { await api(emp?'PATCH':'POST', emp?`employees/${emp.id}`:`clients/${S.clientId}/employees`, body); await loadClient(); render(); toast('Guardado','ok'); return true; }
        catch(e){ fail(e); return false; }
      });
    return m;
  }

  // ── AJUSTES (tasas de ley y aportes del empleador, por empresa) ──
  function clientName(){ const c=S.clients.find(x=>x.id===S.clientId); return c?c.legal_name:''; }
  async function renderAjustes(){
    let s; try{ s=(await api('GET',`clients/${S.clientId}/settings`)).settings; }catch(e){ return fail(e); }
    const pct=v=>(Number(v)*100).toFixed(2);
    const F=(id,label,val)=>`<label class="f"><span>${esc(label)}</span><input id="${id}" inputmode="decimal" value="${esc(val)}"></label>`;
    view.innerHTML = `<div class="card stack"><h2>Ajustes · ${esc(clientName())}</h2>
      <p class="hint">Tasas de ley y aportes del empleador para esta empresa. Afectan los cálculos de la nómina.</p>
      <div class="ajs"><h3>Tipo de período</h3><label class="f" style="max-width:240px"><span>Período</span><select id="a-pt"><option value="quincenal" ${s.period_type!=='mensual'?'selected':''}>Quincenal</option><option value="mensual" ${s.period_type==='mensual'?'selected':''}>Mensual</option></select></label></div>
      <div class="ajs"><h3>Deducciones del empleado</h3><div class="grid2">${F('a-afp','AFP (Pensión) %',pct(s.empleado.afp))}${F('a-sfs','SFS (Salud) %',pct(s.empleado.sfs))}${F('a-tsfs','Tope salario SFS (RD$)',s.empleado.tope_sfs)}${F('a-tafp','Tope salario AFP (RD$)',s.empleado.tope_afp)}</div></div>
      <div class="ajs"><h3>Escala ISR (anual, RD$)</h3><div class="grid2">${F('a-ex','Exento hasta',s.isr.exento)}${F('a-t2','Tramo 15% hasta',s.isr.tramo2)}${F('a-t3','Tramo 20% hasta',s.isr.tramo3)}</div><p class="hint">Sobre el último tramo se aplica 25%.</p></div>
      <div class="ajs"><h3>Aportes del empleador</h3><div class="grid2">${F('p-afp','AFP (Pensión) %',pct(s.empleador.afp))}${F('p-sfs','SFS (Salud) %',pct(s.empleador.sfs))}${F('p-srl','SRL (Riesgos) %',pct(s.empleador.srl))}${F('p-inf','INFOTEP %',pct(s.empleador.infotep))}</div></div>
      <div class="row"><button class="btn primary" id="a-save">Guardar ajustes</button></div></div>`;
    const pv=id=>Number($('#'+id).value)/100, nv=id=>Number($('#'+id).value);
    $('#a-save').onclick=async()=>{
      const body={ period_type:$('#a-pt').value,
        empleado:{ afp:pv('a-afp'), sfs:pv('a-sfs'), tope_sfs:nv('a-tsfs'), tope_afp:nv('a-tafp') },
        isr:{ exento:nv('a-ex'), tramo2:nv('a-t2'), tramo3:nv('a-t3') },
        empleador:{ afp:pv('p-afp'), sfs:pv('p-sfs'), srl:pv('p-srl'), infotep:pv('p-inf') } };
      try{ await api('PUT',`clients/${S.clientId}/settings`, body); toast('Ajustes guardados','ok'); }catch(e){ fail(e); }
    };
  }

  // ── FICHA DEL EMPLEADO (historial de nómina) ──
  async function openEmployee(id){
    let d; try{ d=await api('GET',`employees/${id}/history`); }catch(e){ return fail(e); }
    const e=d.employee; const H=d.history||[]; const t=d.totals||{ingresos:0,deducciones:0,neto:0};
    view.innerHTML = `<div class="card"><div class="row"><button class="btn sm ghost" id="back">← Empleados</button><h2 style="margin:0">${esc(e.full_name)}</h2>${e.active?'<span class="pill ok">Activo</span>':'<span class="pill">Inactivo</span>'}<span class="spacer"></span><button class="btn sm" id="edit">Editar</button></div>
      <div class="muted" style="margin-top:4px">${esc(e.position||'—')} · Cédula ${esc(e.identifier||'—')}${e.notes?' · '+esc(e.notes):''}</div>
      <div class="total-kpis" style="margin-top:12px">
        <div class="k"><div class="muted">Períodos pagados</div><div class="v">${d.periods_count}</div></div>
        <div class="k"><div class="muted">Ingresos acum.</div><div class="v">${money(t.ingresos)}</div></div>
        <div class="k"><div class="muted">Deducciones acum.</div><div class="v">${money(t.deducciones)}</div></div>
        <div class="k neto"><div class="muted">Neto acum.</div><div class="v">${money(t.neto)}</div></div>
      </div></div>
      <div class="card"><h2>Historial de nómina</h2>
      ${H.length?`<div class="table-wrap"><table><tr><th>Período</th><th>Estado</th><th class="num">Ingresos</th><th class="num">Deducciones</th><th class="num">Neto</th></tr>
        ${H.map(r=>`<tr class="clickable" data-per="${r.period.id}" title="Abrir período"><td><b>${esc(r.period.label)}</b></td><td>${r.period.status==='closed'?'<span class="pill">Cerrado</span>':'<span class="pill ok">Borrador</span>'}</td><td class="num">${money(r.ingresos)}</td><td class="num">${money(r.deducciones)}</td><td class="num"><b>${money(r.neto)}</b></td></tr>`).join('')}</table></div>`
        :'<div class="empty">Este empleado aún no aparece en ningún período.</div>'}</div>`;
    $('#back').onclick=()=>{ S.tab='empleados'; render(); };
    $('#edit').onclick=()=> employeeModal(S.employees.find(x=>x.id===e.id)||e);
    view.querySelectorAll('[data-per]').forEach(tr=> tr.onclick=()=> openPeriod(tr.dataset.per));
  }

  // ── COLUMNAS ──
  function renderColumns(){
    view.innerHTML = `<div class="card"><div class="row"><h2>Columnas de nómina</h2><span class="spacer"></span><button class="btn primary" id="add">+ Columna</button></div>
      <p class="hint">Defina los conceptos de esta empresa. <b>Monto</b> = dinero; <b>Número</b> = cantidad (horas, días…); <b>Texto</b> = nota; <b>Fórmula</b> = se calcula con otras columnas por su <i>clave</i> (ej. <span class="mono">sueldo + horas_extra * 1.35</span>). El <b>signo</b> dice si una columna suma al neto (ingreso) o resta (deducción).</p>
      ${S.columns.length ? `<div class="table-wrap"><table><tr><th>Orden</th><th>Nombre</th><th>Clave</th><th>Tipo</th><th>Signo</th><th>Fórmula</th><th></th></tr>
        ${S.columns.map(c=>`<tr><td class="num">${c.position}</td><td><b>${esc(c.label)}</b></td><td class="mono">${esc(c.key)}</td><td>${esc(TYPE_LABEL[c.type]||c.type)}</td>
          <td>${c.type==='monto'||c.type==='formula' ? (c.sign>0?'+ ingreso':c.sign<0?'− deducción':'neutro') : '—'}</td><td class="mono">${esc(c.formula||'')}</td>
          <td class="num"><button class="btn sm" data-ed="${c.id}">Editar</button> <button class="btn sm danger" data-del="${c.id}">Borrar</button></td></tr>`).join('')}</table></div>`
        : '<div class="empty">Aún no hay columnas. Cree, por ejemplo, «Sueldo» (Monto, +) y una deducción.</div>'}</div>`;
    $('#add').onclick = () => columnModal(null);
    view.querySelectorAll('[data-ed]').forEach(b=> b.onclick=()=> columnModal(S.columns.find(x=>x.id===b.dataset.ed)));
    view.querySelectorAll('[data-del]').forEach(b=> b.onclick=async()=>{ if(!confirm('¿Borrar esta columna?'))return; try{ await api('DELETE',`columns/${b.dataset.del}`); await loadClient(); render(); toast('Columna borrada','ok'); }catch(e){ fail(e);} });
  }
  function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').replace(/^([0-9])/,'c$1').slice(0,39); }
  function columnModal(col){
    const keys = S.columns.filter(c=>!col||c.id!==col.id).map(c=>c.key);
    modal(`${col?'Editar':'Nueva'} columna`, `
      <label class="f"><span>Nombre *</span><input id="m-label" maxlength="60" value="${esc(col?.label||'')}"></label>
      <label class="f"><span>Clave (para fórmulas) *</span><input id="m-key" class="mono" maxlength="39" value="${esc(col?.key||'')}" ${col?'disabled':''} placeholder="ej. sueldo"></label>
      <label class="f"><span>Tipo *</span><select id="m-type">${Object.entries(TYPE_LABEL).map(([k,v])=>`<option value="${k}" ${col?.type===k?'selected':''}>${v}</option>`).join('')}</select></label>
      <div id="m-signwrap"><label class="f"><span>Signo (para el neto)</span><select id="m-sign">
        <option value="1">+ Ingreso (suma)</option><option value="-1">− Deducción (resta)</option><option value="0">Neutro (no afecta el neto)</option></select></label>
        <label class="row" style="gap:8px"><input type="checkbox" id="m-inc" checked style="width:auto"> Incluir en los totales</label></div>
      <label class="f" id="m-formwrap" style="display:none"><span>Fórmula</span><input id="m-formula" class="mono" maxlength="500" value="${esc(col?.formula||'')}" placeholder="sueldo + horas_extra * 1.35">
        <span class="hint">Claves disponibles: ${esc(keys.join(', ')||'(aún ninguna)')}</span></label>`,
      async () => {
        const type=$('#m-type').value;
        const body={ label:$('#m-label').value.trim(), key: col?col.key:slug($('#m-key').value||$('#m-label').value), type,
          sign:Number($('#m-sign').value), include_total:$('#m-inc').checked, formula: type==='formula'?$('#m-formula').value.trim():null,
          position: col?col.position:(S.columns.reduce((m,c)=>Math.max(m,c.position),0)+1) };
        if(!body.label){ toast('El nombre es obligatorio','err'); return false; }
        if(!col && !/^[a-z][a-z0-9_]{0,38}$/.test(body.key)){ toast('Clave inválida (letras minúsculas, números y _)','err'); return false; }
        if(type==='formula'){ try{ parse(tokenize(body.formula||'')); }catch(_){ toast('La fórmula no es válida','err'); return false; } }
        try{ await api(col?'PATCH':'POST', col?`columns/${col.id}`:`clients/${S.clientId}/columns`, body); await loadClient(); render(); toast('Guardado','ok'); return true; }
        catch(e){ fail(e); return false; }
      });
    const type=$('#m-type'), formwrap=$('#m-formwrap'), signwrap=$('#m-signwrap'), key=$('#m-key'), label=$('#m-label');
    const sync=()=>{ const t=type.value; formwrap.style.display=t==='formula'?'flex':'none'; signwrap.style.display=(t==='monto'||t==='formula')?'block':'none'; };
    type.onchange=sync; sync();
    if(col){ $('#m-sign').value=String(col.sign); $('#m-inc').checked=col.include_total!==false; }
    if(!col && label && key){ label.oninput=()=>{ if(!key.dataset.touched) key.value=slug(label.value); }; key.oninput=()=>{ key.dataset.touched='1'; }; }
  }

  // ── PERÍODOS ──
  function renderPeriods(){
    view.innerHTML = `<div class="card"><div class="row"><h2>Períodos de nómina</h2><span class="spacer"></span><button class="btn primary" id="add">+ Nuevo período</button></div>
      ${S.periods.length ? `<div class="table-wrap"><table><tr><th>Período</th><th>Estado</th><th>Creado</th><th></th></tr>
        ${S.periods.map(p=>`<tr><td><b>${esc(p.label)}</b></td><td>${p.status==='closed'?'<span class="pill">Cerrado</span>':'<span class="pill ok">Borrador</span>'}</td><td class="muted">${new Date(p.created_at).toLocaleDateString('es-DO')}</td>
          <td class="num"><button class="btn sm primary" data-open="${p.id}">Abrir</button> <button class="btn sm danger" data-del="${p.id}">Borrar</button></td></tr>`).join('')}</table></div>`
        : '<div class="empty">Aún no hay períodos. Cree el primero (ej. «Nómina octubre 2026»).</div>'}</div>`;
    $('#add').onclick = () => {
      const def = `Nómina ${new Date().toLocaleDateString('es-DO',{month:'long',year:'numeric'})}`;
      modal('Nuevo período', `<label class="f"><span>Nombre del período *</span><input id="m-label" maxlength="80" value="${esc(def)}"></label>`,
        async()=>{ const label=$('#m-label').value.trim(); if(!label){toast('Escriba un nombre','err');return false;}
          try{ const now=new Date(); const { period } = await api('POST',`clients/${S.clientId}/periods`, { label, year:now.getFullYear(), month:now.getMonth()+1 }); await loadClient(); openPeriod(period.id); toast('Período creado','ok'); return true; }catch(e){ fail(e); return false; } });
    };
    view.querySelectorAll('[data-open]').forEach(b=> b.onclick=()=> openPeriod(b.dataset.open));
    view.querySelectorAll('[data-del]').forEach(b=> b.onclick=async()=>{ if(!confirm('¿Borrar este período y sus datos capturados?'))return; try{ await api('DELETE',`periods/${b.dataset.del}`); await loadClient(); render(); toast('Período borrado','ok'); }catch(e){ fail(e);} });
  }

  async function openPeriod(id){
    try{ const d = await api('GET',`periods/${id}`); S.period = d; S.lastPeriodId = id; render(); }catch(e){ fail(e); }
  }

  function renderPeriod(){
    const d = S.period; const p = d.period;
    const cols = d.columns || [];
    const editable = cols.filter(c=>c.type!=='formula');
    const closed = p.status==='closed';
    const locked = !closed && !!p.novedades_locked;   // corte pasado: sólo lectura
    const ro = closed || locked;                       // read-only (no se captura)
    // valores locales editables: map employee_id -> {key:val}
    const vals = {}; (d.rows||[]).forEach(r=> vals[r.employee.id] = {}); // se llenan abajo con lo guardado
    // reconstruir valores capturados desde las celdas no-fórmula
    (d.rows||[]).forEach(r=>{ editable.forEach(c=>{ const v=r.cells[c.key]; vals[r.employee.id][c.key] = (c.type==='texto')? (v||'') : (v===0?'' : v); }); });

    const head = `<div class="card"><div class="row">
      <select id="per-sel" style="min-width:230px;font-weight:700">${S.periods.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select>
      <button class="btn sm" id="per-new">+ Nuevo</button>
      ${closed?'<span class="pill">Cerrado</span>':locked?'<span class="pill" style="color:var(--accent2)">🔒 Novedades cerradas (corte)</span>':'<span class="pill ok">Borrador</span>'}${d.settings?`<span class="pill">${d.settings.period_type==='mensual'?'Mensual':'Quincenal'}</span>`:''}<span class="spacer"></span>
      <button class="btn sm" id="volantes">🧾 Volantes</button>
      <button class="btn sm" id="pdf-all">⤓ PDF</button>
      <button class="btn sm" id="export">⇩ Excel</button>
      <button class="btn sm" id="report">⤓ Reporte PDF</button>
      <button class="btn sm" id="csv">⤓ CSV banco</button>
      <button class="btn sm" id="toggle">${closed?'Reabrir':locked?'Reabrir novedades':'Cerrar'}</button>
      <button class="btn sm danger" id="del-per" title="Eliminar período">🗑</button>
      ${ro?'':'<button class="btn" id="save">Guardar</button><button class="btn primary" id="procesar">✓ Procesar nómina</button>'}</div>
      <div class="total-kpis" id="kpis"></div></div>`;

    $('#toggle').onclick = async () => { try{ const patch = p.status==='closed' ? { status:'draft' } : locked ? { novedades_locked:false } : { status:'closed' }; await api('PATCH',`periods/${p.id}`, patch); await openPeriod(p.id); toast('Período actualizado','ok'); }catch(e){ fail(e); } };

  // ── CSV para el banco (Cédula, Nombre, Forma de pago, Neto) ──

    const d=S.period; const cols=d.columns||[]; const rows=[['Cédula','Nombre','Forma de pago','Neto a pagar']];
    (d.rows||[]).forEach(r=>{ const res=computeRow(cols, readRowValues(r.employee.id)); rows.push([r.employee.identifier||'', r.employee.full_name, r.employee.forma_pago||'', res.neto.toFixed(2)]); });
    const csv=rows.map(r=>r.map(c=>{ const s=String(c==null?'':c); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\r\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=('Banco '+(d.period.label||'periodo')).replace(/[^\w .\-–]+/g,'_')+'.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  }

      doc.text(String(r.employee.full_name||'').slice(0,42), M, y); doc.text(String(r.employee.position||'').slice(0,28), 95, y);
      doc.text(money(res.ingresos),150,y,{align:'right'}); doc.text(money(res.deducciones),188,y,{align:'right'}); doc.text(money(apo),225,y,{align:'right'}); doc.text(money(res.neto),W-M,y,{align:'right'});
      tB+=res.ingresos;tD+=res.deducciones;tN+=res.neto;tA+=apo; y+=5.4; if(y>195){ doc.addPage(); y=16; } });
    y+=1; doc.setDrawColor(100); doc.line(M,y,W-M,y); y+=5; doc.setFont('helvetica','bold');

  function downloadB64(b64, name, mime){
    const bin = atob(b64); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr],{type:mime})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  // ── volante de pago (desglose imprimible por empleado) ──
  function money2(v){ return (Number(v)||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  // Fecha del recibo: la del período (fin de la quincena si el label trae rango),
  // no la de impresión. Cae al último día del mes del período, o a hoy si no hay.
  function periodDate(){
    const p=(S.period&&S.period.period)||{};
    const m=String(p.label||'').match(/(\d{1,2})(?:\s*[–\-aA]\s*(\d{1,2}))?\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})/);
    if(m) return `${(m[2]||m[1]).padStart(2,'0')}/${m[3].padStart(2,'0')}/${m[4]}`;
    if(p.year&&p.month){ const last=new Date(p.year, p.month, 0).getDate(); return `${String(last).padStart(2,'0')}/${String(p.month).padStart(2,'0')}/${p.year}`; }
    return new Date().toLocaleDateString('es-DO',{day:'2-digit',month:'2-digit',year:'numeric'});
  }
  // Monto a letras en pesos dominicanos (para la declaración del recibo):
  // «veintiocho mil cuatrocientos ... pesos dominicanos con 78/100».
  function numeroALetras(num){
    num=Math.floor(Math.abs(Number(num))||0);
    if(num===0) return 'cero';
    const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
    const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
    const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
    const dos=n=>{ if(n<30) return U[n]; const d=Math.floor(n/10), u=n%10; return D[d]+(u?' y '+U[u]:''); };
    const tres=n=>{ if(n===100) return 'cien'; const c=Math.floor(n/100), r=n%100; return (c?C[c]:'')+(c&&r?' ':'')+(r?dos(r):''); };
    const apoc=s=>/veintiuno$/.test(s)?s.replace(/veintiuno$/,'veintiún'):s.replace(/uno$/,'un');
    const millones=Math.floor(num/1000000), miles=Math.floor((num%1000000)/1000), resto=num%1000;
    const p=[];
    if(millones) p.push(millones===1?'un millón':apoc(tres(millones))+' millones');
    if(miles) p.push(miles===1?'mil':apoc(tres(miles))+' mil');
    if(resto) p.push(tres(resto));
    return p.join(' ').trim();
  }
  function montoEnLetras(v){
    const n=Number(v)||0, ent=Math.floor(n), cent=Math.round((n-ent)*100);
    let s=apocFinal(numeroALetras(ent))+' pesos dominicanos con '+String(cent).padStart(2,'0')+'/100';
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function apocFinal(s){ return /veintiuno$/.test(s)?s.replace(/veintiuno$/,'veintiún'):s.replace(/uno$/,'un'); }
  function readRowValues(empId){ const tr=view.querySelector(`tr[data-emp="${empId}"]`); const values={}; if(tr) tr.querySelectorAll('[data-k]').forEach(inp=>{ const v=inp.value.trim(); if(v!=='') values[inp.dataset.k]=v; }); return values; }
  function payslipHTML(emp, cols, values){
    const r=computeRow(cols, values);
    const client=S.clients.find(c=>c.id===S.clientId)||{};
    const included=cols.filter(c=>(c.type==='monto'||c.type==='formula')&&c.include_total);

    const rnc=client.rnc||client.cedula||'';
    const ced=emp.identifier?`, portador(a) de la cédula <b>${esc(emp.identifier)}</b>`:'';
    const filas=included.map(c=>{
      const pre=c.key==='sueldo_quincenal'?'':(c.sign>0?'(+) ':'(−) ');
      return `<tr><td>${pre}${esc(c.label)}</td><td class="n">RD$ ${money2(r.cells[c.key])}</td></tr>`;
    }).join('');
    return `<div class="slip">
      <div class="rhd"><div class="co">${esc(client.legal_name||'')}</div><div class="rm">${rnc?('RNC '+esc(rnc)+'<br>'):''}<span class="fx">${fecha}</span></div></div>

      <table class="bd">${filas}<tr class="tt"><td>Total a cobrar</td><td class="n">RD$ ${money2(r.neto)}</td></tr></table>
      <div class="fw"><div class="fl">_____________________<br>Entregado por</div><div class="fl">_____________________<br>Recibido por</div></div>
      <div class="ft">Casa&nbsp;Labs · app.casalabs.com.do</div>
    </div>`;
  }

  // ── descarga de PDF de un clic (jsPDF, vectorial) ──
  let jspdfP;
  function ensureJsPDF(){
    if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve();
    if(!jspdfP) jspdfP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload=res; s.onerror=()=>rej(new Error('No se pudo cargar el generador de PDF')); document.head.appendChild(s); });
    return jspdfP;
  }
  // Dibuja texto con tramos en negrita (segmentos {t,b}) y ajuste de línea, para
  // la declaración del recibo en PDF. La puntuación se pega a la palabra previa.
  function drawRich(doc, segs, x, y, maxW, lineH){
    const toks=[]; for(const s of segs) String(s.t).split(/\s+/).forEach(w=>{ if(w) toks.push({w,b:s.b}); });
    const noSpace=w=>/^[,.;:%)\]]/.test(w);
    doc.setFont('helvetica','normal'); const spaceW=doc.getTextWidth(' ');
    let cx=x, first=true;
    for(const t of toks){
      doc.setFont('helvetica', t.b?'bold':'normal'); const ww=doc.getTextWidth(t.w);
      const needSp=!first && !noSpace(t.w);
      if(!first && cx+(needSp?spaceW:0)+ww>x+maxW){ y+=lineH; cx=x; doc.text(t.w,cx,y); cx+=ww; }
      else { if(needSp) cx+=spaceW; doc.text(t.w,cx,y); cx+=ww; }
      first=false;
    }
    return y;
  }
  function drawPayslip(doc, client, emp, r, cols){
    const M=16, W=210, R=W-M; let y=18;
    const m=v=>money2(v);
    doc.setTextColor(17);
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(String(client.legal_name||''), M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90);
    const rnc=client.rnc||client.cedula||''; if(rnc) doc.text('RNC '+rnc, R, y-3, {align:'right'});
    doc.setTextColor(17); doc.text(periodDate(), R, y+1, {align:'right'});
    y+=5; doc.setDrawColor(17); doc.setLineWidth(0.6); doc.line(M,y,R,y); y+=11;
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('RECIBO DE NÓMINA', W/2, y, {align:'center'}); y+=11;
    doc.setFontSize(10.5); doc.setTextColor(17);
    const segs=[{t:'Yo,',b:false},{t:emp.full_name||'',b:true}];
    if(emp.identifier){ segs.push({t:', portador(a) de la cédula',b:false},{t:emp.identifier,b:true}); }
    segs.push({t:', he recibido de la compañía',b:false},{t:client.legal_name||'',b:true},
      {t:'la suma de',b:false},{t:montoEnLetras(r.neto),b:true},
      {t:`(RD$ ${m(r.neto)}), correspondiente al pago de ${S.period.period.label}.`,b:false});
    y=drawRich(doc, segs, M, y, R-M, 5.4)+8;
    const included=cols.filter(c=>(c.type==='monto'||c.type==='formula')&&c.include_total);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    for(const c of included){ const pre=c.key==='sueldo_quincenal'?'':(c.sign>0?'(+) ':'(-) ');
      doc.text(pre+String(c.label).replace(/[−—–]/g,'-'), M, y); doc.text('RD$ '+m(r.cells[c.key]), R, y, {align:'right'});
      doc.setDrawColor(230); doc.setLineWidth(0.2); doc.line(M,y+1.8,R,y+1.8); y+=7; }
    doc.setDrawColor(17); doc.setLineWidth(0.5); doc.line(M,y-0.5,R,y-0.5); y+=5;
    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.text('Total a cobrar', M, y); doc.text('RD$ '+m(r.neto), R, y, {align:'right'}); y+=26;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(60);
    doc.setDrawColor(120); doc.setLineWidth(0.3); doc.line(M,y,M+70,y); doc.line(R-70,y,R,y);
    doc.text('Entregado por', M, y+5); doc.text('Recibido por', R-70, y+5);
    doc.setFontSize(8.5); doc.setTextColor(150); doc.text('Casa Labs · app.casalabs.com.do', W/2, 287, {align:'center'});
    doc.setTextColor(17);
  }
  async function downloadPdf(empIds){
    if(!S.period) return;
    try{ await ensureJsPDF(); }catch(e){ return fail(e); }
    const JS=window.jspdf.jsPDF; const doc=new JS({unit:'mm',format:'a4'});
    const cols=S.period.columns||[]; const client=S.clients.find(c=>c.id===S.clientId)||{};
    let first=true, one=null;
    for(const id of empIds){ const row=(S.period.rows||[]).find(r=>r.employee.id===id); if(!row) continue; if(!first) doc.addPage(); first=false; one=row.employee.full_name; drawPayslip(doc, client, row.employee, computeRow(cols, readRowValues(id)), cols); }
    if(first){ toast('No hay empleados para descargar','err'); return; }
    const base = empIds.length===1 ? ('Volante - '+one) : ('Volantes '+S.period.period.label);
    doc.save(base.replace(/[^\w .\-–]+/g,'_')+'.pdf');
  }

  // ── Popup de aportes a la TSS (empleador vs empleado) ──
  function aportesBreakdown(){
    const st=S.period&&S.period.settings; const res={ emp:{afp:0,sfs:0}, patr:{afp:0,sfs:0,srl:0,infotep:0} };
    if(!st) return res;
    const f=(st.period_type==='mensual')?1:0.5; const e=st.empleador||{}, em=st.empleado||{}; const cols=S.period.columns||[];
    view.querySelectorAll('tr[data-emp]').forEach(tr=>{ const values={}; tr.querySelectorAll('[data-k]').forEach(inp=>{ values[inp.dataset.k]=inp.value; });
      const r=computeRow(cols, values); if(Number(r.cells['exento_tss'])||0) return; const base=Number(r.cells['sueldo_mensual'])||0;
      const ts=Number(em.tope_sfs)||base, ta=Number(em.tope_afp)||base;
      res.emp.afp+=Math.min(base,ta)*(em.afp||0)*f; res.emp.sfs+=Math.min(base,ts)*(em.sfs||0)*f;
      res.patr.afp+=Math.min(base,ta)*(e.afp||0)*f; res.patr.sfs+=Math.min(base,ts)*(e.sfs||0)*f; res.patr.srl+=Math.min(base,ts)*(e.srl||0)*f; res.patr.infotep+=base*(e.infotep||0)*f;
    });
    return res;
  }
  function aportesModal(){
    const b=aportesBreakdown();
    const row=(lbl,emp,patr)=>`<tr><td>${lbl}</td><td class="num">${emp==null?'—':money(round2(emp))}</td><td class="num">${patr==null?'—':money(round2(patr))}</td><td class="num"><b>${money(round2((emp||0)+(patr||0)))}</b></td></tr>`;
    const et=round2(b.emp.afp+b.emp.sfs), pt=round2(b.patr.afp+b.patr.sfs+b.patr.srl+b.patr.infotep);
    const bg=modal('Aportes a la TSS', `<div class="table-wrap"><table><tr><th>Concepto</th><th class="num">Empleado</th><th class="num">Empleador</th><th class="num">Total</th></tr>
      ${row('AFP (Pensión)', b.emp.afp, b.patr.afp)}${row('SFS (Salud)', b.emp.sfs, b.patr.sfs)}${row('SRL (Riesgos laborales)', null, b.patr.srl)}${row('INFOTEP', null, b.patr.infotep)}
      <tr class="tot"><td>Total</td><td class="num">${money(et)}</td><td class="num">${money(pt)}</td><td class="num">${money(round2(et+pt))}</td></tr></table></div>
      <p class="hint">Sobre el salario cotizable del período (${S.period.settings&&S.period.settings.period_type==='mensual'?'mensual':'quincenal'}); las personas exentas no aportan.</p>`, async()=>true);
    const ok=bg.querySelector('[data-ok]'); if(ok) ok.textContent='Cerrar'; const x=bg.querySelector('[data-x]'); if(x) x.style.display='none';
  }

  // ── Modal "Novedad" (detalle del empleado: conceptos on/off + neto en vivo) ──
  function novedadModal(empId){
    const d=S.period; if(!d) return; const cols=d.columns||[]; const row=(d.rows||[]).find(r=>r.employee.id===empId); if(!row) return;
    const emp=row.employee; const closed=d.period.status==='closed'||!!d.period.novedades_locked;
    const cur=readRowValues(empId); // valores editables actuales (reflejan el grid)
    const editable=cols.filter(c=>c.type!=='formula');
    const fieldRow=c=>{
      const v=cur[c.key];
      const on = v!=null && String(v)!=='' && !(c.type!=='texto' && Number(v)===0);
      const amt = c.type==='texto'
        ? `<input class="na" data-k="${c.key}" value="${esc(v||'')}" ${closed||!on?'disabled':''}>`
        : `<input class="na num" inputmode="decimal" data-k="${c.key}" value="${on&&v!=null?esc(v):''}" ${closed||!on?'disabled':''}>`;
      return `<div class="nv"><label class="sw"><input type="checkbox" data-on="${c.key}" ${on?'checked':''} ${closed?'disabled':''}></label><span class="nl">${esc(c.label)}</span>${amt}</div>`;
    };
    const formulaRow=c=>`<div class="nv ro"><span class="sw" style="width:36px"></span><span class="nl">${esc(c.label)} <span class="pill calc">fx</span></span><span class="nr" data-calc="${c.key}">—</span></div>`;
    const ingresos=editable.filter(c=>c.sign>=0);
    const deducEdit=editable.filter(c=>c.sign<0);
    const deducLey=cols.filter(c=>c.type==='formula'&&c.sign<0);
    const ingLey=cols.filter(c=>c.type==='formula'&&c.sign>0);
    const inner=`
      <div class="muted" style="margin-bottom:6px">${esc(emp.position||'—')}${emp.forma_pago?' · '+esc(emp.forma_pago):''} · Cédula ${esc(emp.identifier||'—')}</div>
      <div class="nvsec"><h3>Ingresos y datos</h3>${ingLey.map(formulaRow).join('')}${ingresos.map(fieldRow).join('')}</div>
      <div class="nvsec"><h3>Deducciones</h3>${deducLey.map(formulaRow).join('')}${deducEdit.map(fieldRow).join('')||'<div class="muted" style="padding:4px 0">Sin deducciones manuales.</div>'}</div>
      <div class="nvtot"><span>Ingresos <b data-t="ing">—</b></span><span>Deducciones <b data-t="ded">—</b></span><span class="neto">Neto <b data-t="neto">—</b></span></div>`;
    const bg=modal(`Novedad · ${emp.full_name}`, inner, async()=>{
      if(closed) return true;
      try{ const d2=await api('PUT',`periods/${d.period.id}/entries`,{ entries:[{employee_id:empId, values:gather()}] }); S.period=d2; render(); toast('Novedad guardada','ok'); return true; }
      catch(e){ fail(e); return false; }
    });
    if(closed){ const ok=bg.querySelector('[data-ok]'); if(ok) ok.textContent='Cerrar'; }
    function gather(){ const values={}; bg.querySelectorAll('.nv:not(.ro)').forEach(nv=>{ const cb=nv.querySelector('[data-on]'); const inp=nv.querySelector('[data-k]'); if(!cb||!inp||!cb.checked) return; const raw=String(inp.value).trim(); if(raw==='') return; values[inp.dataset.k]=raw; }); return values; }
    function recompute(){ const res=computeRow(cols, gather());
      cols.forEach(c=>{ if(c.type==='formula'){ const el=bg.querySelector(`[data-calc="${c.key}"]`); if(el) el.textContent=money(res.cells[c.key]); } });
      bg.querySelector('[data-t="ing"]').textContent=money(res.ingresos); bg.querySelector('[data-t="ded"]').textContent=money(res.deducciones); bg.querySelector('[data-t="neto"]').textContent=money(res.neto); }
    bg.querySelectorAll('[data-on]').forEach(cb=> cb.addEventListener('change', ()=>{ const inp=cb.closest('.nv').querySelector('[data-k]'); if(inp){ inp.disabled=!cb.checked||closed; if(!cb.checked) inp.value=''; else inp.focus(); } recompute(); }));
    bg.querySelectorAll('.na').forEach(inp=> inp.addEventListener('input', recompute));
    recompute();
  }

  // ── modal ──
  function modal(title, inner, onOk){
    const bg = document.createElement('div'); bg.className='modal-bg';
    bg.innerHTML = `<div class="modal"><h2>${esc(title)}</h2><div class="grid" style="gap:12px">${inner}</div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-x>Cancelar</button><button class="btn primary" data-ok>Guardar</button></div></div>`;
    document.body.appendChild(bg);
    const close=()=>bg.remove();
    bg.querySelector('[data-x]').onclick=close; bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
    bg.querySelector('[data-ok]').onclick=async()=>{ const ok=await onOk(); if(ok!==false) close(); };
    return bg;
  }

  boot();
})();
</script>
