<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/css/mobile-base.css">
<title>Accediendo…</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
  .card { background: white; border-radius: 16px; padding: 40px 32px; box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; max-width: 340px; width: 90%; }
  @media (prefers-color-scheme: dark) { .card { background: #1e293b; } }
  .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 8px; font-size: 18px; }
  p  { margin: 0; font-size: 14px; color: #64748b; }
  .err { color: #ef4444; }
  .ok  { color: #10b981; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="sp"></div>
  <h2 id="msg">Iniciando sesión…</h2>
  <p  id="sub">Conectando con el portal</p>
</div>

<script>
(async () => {
  const set = (msg, sub, err) => {
    document.getElementById('msg').textContent = msg;
    document.getElementById('sub').textContent = sub;
    if (err) {
      document.getElementById('sp').style.display = 'none';
      document.getElementById('msg').className = err === 'ok' ? 'ok' : 'err';
    }
  };

  // Credentials come from the URL hash — never sent to the server.
  // The parent window may navigate this tab to autologin.html#hash shortly after
  // opening it (popup opened sync, credentials decrypted async), so poll briefly
  // before giving up.
  let hash = location.hash.slice(1);
  if (!hash) {
    await new Promise(resolve => {
      let waited = 0;
      const iv = setInterval(() => {
        hash = location.hash.slice(1);
        waited += 100;
        if (hash || waited >= 20000) { clearInterval(iv); resolve(); }
      }, 100);
    });
  }
  if (!hash) { set('Error', 'No se recibieron datos de acceso. Cierra esta pestaña y vuelve a darle a ENTRAR en Direct.', 'err'); return; }

  let params;
  try { params = JSON.parse(decodeURIComponent(atob(hash))); }
  catch { set('Error', 'Datos de acceso inválidos.', 'err'); return; }

  const { url, user, pass, cedula, tarjeta,
    userField: configuredUserField, passField: configuredPassField, submitField: configuredSubmitField,
    hiddenFields: prefetchedFields, formAction: prefetchedAction } = params;
  if (!url || !user || !pass) { set('Error', 'Faltan datos de acceso.', 'err'); return; }

  const CF_RELAY = 'https://portal-rd-relay.samauel05.workers.dev';
  const VERCEL_RELAY = '/api/relay/viewstate';

  let hiddenFields = prefetchedFields || [];
  let formAction = prefetchedAction || url;
  let userField = configuredUserField || null;
  let passField = configuredPassField || null;
  let submitField = configuredSubmitField || null;
  let relayOk = hiddenFields.length > 0;

  if (relayOk) {
    // ViewState was pre-fetched by the main app — skip the relay call entirely
    set('Enviando credenciales…', 'Formulario listo ✓ — redirigiendo');
  } else {
    set('Cargando portal…', url);

    const tryRelay = async (relayBase) => {
      const r = await fetch(relayBase + '?url=' + encodeURIComponent(url), { signal: AbortSignal.timeout(12000) });
      if (!r.ok) throw new Error('relay ' + r.status);
      return r.json();
    };

    try {
      let d;
      try { d = await tryRelay(CF_RELAY); }
      catch { d = await tryRelay(VERCEL_RELAY); }
      hiddenFields = d.hiddenFields || [];
      if (d.formAction) formAction = d.formAction;
      if (!userField && d.userField) userField = d.userField;
      if (!passField && d.passField) passField = d.passField;
      if (!submitField && d.submitField) submitField = d.submitField;
      relayOk = hiddenFields.length > 0;
    } catch { /* proceed without relay */ }

    set('Enviando credenciales…', relayOk ? 'Formulario listo ✓ — redirigiendo' : 'Enviando sin ViewState…');
  }

  // Fallback field names
  if (!userField) userField = 'usuario';
  if (!passField) passField = 'contrasena';

  set('Enviando credenciales…', relayOk ? 'Formulario listo ✓ — redirigiendo' : 'Enviando sin ViewState…');
  // Navigate to CF Worker /submit page — it serves a page that synchronously
  // calls form.submit() to the portal, bypassing iOS Safari popup restrictions.
  // Credentials travel only in the URL fragment (never sent to the server).
  const submitPayload = {
    url,
    formAction,
    user,
    pass,
    userField,
    passField,
    submitField: submitField || null,
    cedula: cedula || undefined,
    tarjeta: tarjeta || undefined,
    hiddenFields,
  };
  const submitHash = btoa(encodeURIComponent(JSON.stringify(submitPayload)));
  window.location.replace(CF_RELAY + '/submit#' + submitHash);
})();
</script>
</body>
</html>
