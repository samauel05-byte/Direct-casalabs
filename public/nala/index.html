<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
/* Tema antes del primer pintado: el mismo que eligió el usuario en Direct (claro por defecto). Así NALA,
   que ahora se abre en su propia pestaña, ya no se pone oscuro solo porque el equipo esté en modo oscuro. */
(function(){var p='light';try{p=localStorage.getItem('direct_theme')||'light'}catch(e){}
var t=p==='light'||p==='dark'?p:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="stylesheet" href="/css/mobile-base.css">
<title>NALA — 606 / 607</title>
<link rel="stylesheet" href="/nala/css/nala.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>/* Tipografia de marca Direct: Josefin Sans en titulos, Poppins en el resto */:root{--font-body:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-head:'Josefin Sans','Poppins',system-ui,sans-serif}body,input,select,textarea,button,.btn{font-family:var(--font-body)}h1,h2,h3,h4,h5,.title,.ttl,.brand,.auth-ttl{font-family:var(--font-head)}</style></head>
<body>
<aside class="side" aria-label="Módulos de NALA">
  <div class="brand">
    <div class="logo">N</div>
    <div><b>NALA</b><small>Núcleo Automatizado de Listados Administrativos</small></div>
  </div>
  <button class="btn sm" style="margin:10px 14px 2px;width:calc(100% - 28px);justify-content:flex-start" title="Volver a Accesos" onclick="NALA.goBack()">‹ Volver a Accesos</button>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot"><button class="btn sm" id="theme-btn" style="width:100%;margin-bottom:8px" title="Cambiar entre fondo blanco y oscuro" onclick="(function(){var d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('direct_theme',n)}catch(e){}document.getElementById('theme-btn').textContent=n==='dark'?'☀ Fondo blanco':'🌙 Fondo oscuro'})()">🌙 Fondo oscuro</button><div id="tenant"></div><div id="who"></div><div style="margin-top:6px">NALA · CaSa Labs</div></div>
</aside>
<div class="main">
  <header class="topbar">
    <button class="btn sm menu-btn" id="menu-btn" aria-label="Menú">☰</button>
    <h1 id="title">NALA</h1>
    <span class="scope-chip" id="scope-chip"></span>
    <label class="f" title="Empresa activa en todas las pantallas"><span>Empresa activa</span><select id="scope-client" style="max-width:280px"></select></label>
    <label class="f"><span>Período</span><span style="display:flex;gap:6px;align-items:center"><input type="month" id="scope-period"><button type="button" class="btn sm" id="scope-period-all" title="Ver todos los períodos (sin filtrar por mes)">Todos</button></span></label>
    <label class="f"><span>Formato</span><select id="scope-format"><option value="">606 y 607</option><option value="606">606 · Compras</option><option value="607">607 · Ventas</option></select></label>
  </header>
  <main class="content" id="content"><div class="empty">Cargando NALA…</div></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="/cami/vendor/pdf.min.js"></script>
<script src="/nala/js/app.js"></script>
<script src="/nala/js/views-dashboard.js"></script>
<script src="/nala/js/views-clients.js"></script>
<script src="/nala/js/views-batches.js"></script>
<script src="/nala/js/views-audit.js"></script>
<script src="/nala/js/views-export.js"></script>
<script src="/nala/js/views-admin.js"></script>
<script>(function(){var b=document.getElementById('theme-btn');if(b&&document.documentElement.getAttribute('data-theme')==='dark')b.textContent='☀ Fondo blanco';})();</script>
</body>
</html>
